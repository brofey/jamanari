<html lang="ru">
<head>

<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --jam:#c2255c; --jam-deep:#7c1640; --plum:#3d1638; --cream:#fff6e6; --lime:#d6f23c;
  --panel:#fff6e6; --ink:#3d1638; --line:#3d1638; --page:#9ed8f0;
  --display:'Dela Gothic One','Rubik','Arial Black',system-ui,sans-serif;
  --ui:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:#3d1638; --ink:#fff6e6; --line:#1d0a1b; --page:#1c2742; }
}
:root[data-theme="dark"]{ --panel:#3d1638; --ink:#fff6e6; --line:#1d0a1b; --page:#1c2742; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--ui);font-weight:500;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--lime);outline-offset:3px}

/* ——— HUD ——— */
#hud{position:fixed;inset:0;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 12px)}
.top{display:grid;grid-template-columns:1fr auto;align-items:start;gap:8px}
.chip{display:inline-flex;align-items:baseline;gap:8px;background:var(--panel);color:var(--ink);
  border:3px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:5px 14px 6px;font-weight:700}
#size{font-family:var(--display);font-size:clamp(20px,5.4vw,30px);font-weight:400;line-height:1.1;white-space:nowrap}
#combo{font-style:normal;font-family:var(--display);color:var(--jam);font-size:clamp(15px,4vw,20px);min-width:0;display:inline-block;transform-origin:left center}
:root[data-theme="dark"] #combo{color:var(--lime)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #combo{color:var(--lime)}}
#combo.bump{animation:bump .25s ease-out}
@keyframes bump{0%{transform:scale(1.7)}100%{transform:scale(1)}}
.next{display:flex;align-items:center;gap:6px;margin:9px 0 0 6px;width:min(46vw,190px)}
.bar{flex:1;height:10px;border-radius:8px;background:rgba(61,22,56,.35);border:2px solid var(--line);overflow:hidden}
#bar{display:block;height:100%;width:0;background:var(--lime);border-radius:0 6px 6px 0}
#nextIcon{font-size:20px;line-height:1;filter:drop-shadow(0 2px 0 rgba(61,22,56,.5))}
.btns{justify-self:end;display:flex;gap:8px;pointer-events:auto}
.btns button{width:44px;height:44px;border-radius:14px;background:var(--panel);border:3px solid var(--line);
  box-shadow:0 4px 0 var(--line);font-weight:700;font-size:18px;line-height:1;padding:0}
.btns button:active,.bark:active,.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btns button.off{opacity:.55;text-decoration:line-through}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translate(-50%,-12px) scale(.9);opacity:0;
  background:var(--plum);color:#fff6e6;border:3px solid #fff6e6;border-radius:16px;padding:8px 16px;font-weight:700;
  font-size:clamp(14px,3.8vw,18px);text-align:center;max-width:min(92vw,560px);transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.bark{position:absolute;right:calc(env(safe-area-inset-right,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  width:84px;height:84px;border-radius:50%;background:var(--jam);color:#fff6e6;border:4px solid #3d1638;box-shadow:0 6px 0 #3d1638;
  font-family:var(--display);font-size:19px;pointer-events:auto;padding:0}
.bark small{display:block;font-family:var(--ui);font-weight:500;font-size:11px;opacity:.85;margin-top:2px}
@media (pointer:coarse){.bark small{display:none}}

/* ——— всплывашки и джойстик ——— */
#pops{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--ui);font-weight:500;font-size:clamp(14px,3.8vw,19px);color:#fff6e6;opacity:0;
  text-shadow:-1px -1px 0 #3d1638,1px -1px 0 #3d1638,-1px 1px 0 #3d1638,1px 1px 0 #3d1638,0 2px 0 #3d1638,0 3px 4px rgba(61,22,56,.45);will-change:transform,opacity}
.pop.big{font-weight:700;font-size:clamp(20px,5.6vw,32px);color:var(--lime);
  text-shadow:-1.5px -1.5px 0 #3d1638,1.5px -1.5px 0 #3d1638,-1.5px 1.5px 0 #3d1638,1.5px 1.5px 0 #3d1638,0 3px 0 #3d1638,0 4px 6px rgba(61,22,56,.45)}
.pop.fly{animation:popUp 1s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes popUp{0%{opacity:0;margin-top:10px;scale:.5}15%{opacity:1;scale:1.15}30%{scale:1}75%{opacity:1}100%{opacity:0;margin-top:-70px}}
#joy{position:fixed;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;border:3px solid rgba(255,246,230,.8);
  background:rgba(61,22,56,.18);pointer-events:none;opacity:0;transition:opacity .15s}
#joy.on{opacity:1}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#fff6e6;border:3px solid #3d1638;box-shadow:0 3px 0 #3d1638}

/* ——— экраны ——— */
.screen{position:fixed;inset:0;display:flex;
  padding:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-right,0px) + 22px) calc(env(safe-area-inset-bottom,0px) + 26px) calc(env(safe-area-inset-left,0px) + 22px)}
#title{flex-direction:column;justify-content:flex-end;align-items:flex-start;
  background:linear-gradient(to top,rgba(61,22,56,.62) 0%,rgba(61,22,56,.22) 38%,rgba(61,22,56,0) 62%)}
#title h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,12.5vw,118px);line-height:.92;margin:0 0 14px;color:#fff6e6;letter-spacing:-.01em;
  text-shadow:0 3px 0 #3d1638,0 6px 0 #3d1638,0 9px 0 var(--jam),3px 3px 0 #3d1638,-3px 3px 0 #3d1638,3px -3px 0 #3d1638,-3px -3px 0 #3d1638}
#title p{margin:0;color:#fff6e6;font-size:clamp(15px,4vw,19px);line-height:1.45;max-width:34em;text-shadow:0 2px 0 rgba(61,22,56,.8)}
#title .how{opacity:.92;margin-top:14px;font-size:clamp(13px,3.5vw,16px)}
.go{margin-top:18px;font-family:var(--display);font-weight:400;font-size:clamp(20px,5.5vw,28px);background:var(--lime);color:#3d1638;
  border:4px solid #3d1638;border-radius:22px;box-shadow:0 6px 0 #3d1638;padding:12px 34px 14px}
#best{margin-top:14px;font-weight:700}
.center{align-items:center;justify-content:center;background:rgba(61,22,56,.45)}
.card{background:var(--panel);color:var(--ink);border:4px solid var(--line);border-radius:28px;box-shadow:0 8px 0 var(--line);
  padding:22px 26px 26px;width:min(92vw,440px);text-align:center;max-height:100%;overflow:auto}
.card h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,6vw,30px);margin:0 0 6px}
.card .huge{font-family:var(--display);font-size:clamp(44px,13vw,72px);line-height:1;margin:8px 0 6px;color:var(--jam)}
:root[data-theme="dark"] .card .huge{color:var(--lime)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card .huge{color:var(--lime)}}
.card p{margin:6px 0;line-height:1.4}
.quit{display:block;margin:16px auto 0;background:none;border:0;padding:6px 10px;color:inherit;font-size:15px;text-decoration:underline;text-underline-offset:3px;opacity:.8}
#rank{font-weight:700;font-size:1.15em}
#haul{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 4px;padding:0;list-style:none}
#haul li{border:2px solid var(--line);border-radius:12px;padding:3px 9px;font-weight:700;font-size:15px}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--plum);color:#fff6e6;font-size:18px;line-height:1.5}
@media (prefers-reduced-motion: reduce){.pop.fly{animation-duration:.01s}}
</style>
</head>

<canvas id="c" tabindex="0" aria-label="Игра: пёс Джем катит ком из вещей"></canvas>

<div id="hud" hidden>
  <div class="top">
    <div>
      <div class="chip"><b id="size">⌀ 50 см</b><i id="combo"></i></div>

    </div>
    <div class="btns">

  <div id="toast" class="toast" role="status"></div>

</div>
<div id="pops" aria-hidden="true"></div>
<div id="joy" aria-hidden="true"><i></i></div>

<section id="title" class="screen">
  <h1>Джем<br>катит<br>всё</h1>

  <button id="bStart" class="go">Гулять</button>
  <p id="best" hidden></p>
</section>

<section id="pause" class="screen center" hidden>
  <div class="card">
    <h2>Пауза</h2>
    <p>Джем сел и ждёт.</p>
    <button id="bResume" class="go">Гулять дальше</button>
    <button id="bQuit" class="quit">Закончить прогулку</button>
  </div>
</section>

<section id="end" class="screen center" hidden>
  <div class="card">
    <h2>Прогулка окончена</h2>
    <div class="huge" id="endSize">⌀ 0 м</div>
    <p id="rank"></p>
    <p id="endCount"></p>
    <ul id="haul"></ul>
    <p id="endHint"></p>
    <p id="endBest"></p>
    <button id="bAgain" class="go">Гулять ещё раз</button>
  </div>
</section>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
if (!window.THREE) { $('err').hidden = false; $('title').hidden = true; return; }
const T = window.THREE, PI = Math.PI, TAU = PI * 2, H = PI / 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function lerpAngle(a, b, t){ let d = (b - a) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return a + d * t; }
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOUCH = window.matchMedia && matchMedia('(pointer: coarse)').matches;

// ————————————————————————————— геометрия из примитивов
function part(geo, color, x, y, z, rx, ry, rz, sx, sy, sz){
  const m = new T.Matrix4().compose(
    new T.Vector3(x || 0, y || 0, z || 0),
    new T.Quaternion().setFromEuler(new T.Euler(rx || 0, ry || 0, rz || 0)),
    new T.Vector3(sx === undefined ? 1 : sx, sy === undefined ? 1 : sy, sz === undefined ? 1 : sz));
  return { geo, color, m };
}
const box  = (w,h,d,c,x,y,z,rx,ry,rz) => part(new T.BoxGeometry(w,h,d), c, x,y,z, rx,ry,rz);
const cyl  = (rt,rb,h,n,c,x,y,z,rx,ry,rz) => part(new T.CylinderGeometry(rt,rb,h,n), c, x,y,z, rx,ry,rz);
const cone = (r,h,n,c,x,y,z,rx,ry,rz) => part(new T.ConeGeometry(r,h,n), c, x,y,z, rx,ry,rz);
const sph  = (r,c,x,y,z,sx,sy,sz,det) => part(new T.IcosahedronGeometry(r, det === undefined ? 1 : det), c, x,y,z, 0,0,0, sx,sy,sz);
// двускатная крыша вдоль оси X: длина, глубина, высота, цвет, x, y основания, z
const roof = (len,dep,h,c,x,yb,z) => { const r = dep / 2 / 0.866, sz = h / (1.5 * r);
  return part(new T.CylinderGeometry(r, r, len, 3), c, x, yb + 0.5 * r * sz, z, -H, 0, H, 1, 1, sz); };
const four = (f, x, z) => [f(x, z), f(-x, z), f(x, -z), f(-x, -z)];

function merge(parts, jitter){
  parts = parts.flat(Infinity);
  if (jitter === undefined) jitter = 0.07;
  const gs = []; let n = 0;
  for (const p of parts){ let g = p.geo; if (g.index) g = g.toNonIndexed(); g.applyMatrix4(p.m); gs.push(g); n += g.attributes.position.count; }
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3), c = new T.Color();
  let o = 0;
  for (let i = 0; i < parts.length; i++){
    const a = gs[i].attributes.position.array, cnt = a.length / 3;
    pos.set(a, o * 3); c.set(parts[i].color);
    for (let k = 0; k < cnt; k += 3){
      const j = 1 + (Math.random() - 0.5) * jitter * 2;
      for (let q = 0; q < 3 && k + q < cnt; q++){ const b = (o + k + q) * 3; col[b] = c.r * j; col[b+1] = c.g * j; col[b+2] = c.b * j; }
    }
    o += cnt; gs[i].dispose();
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(pos, 3));
  g.setAttribute('color', new T.BufferAttribute(col, 3));
  g.computeVertexNormals();
  return g;
}

    camera.near = camD * 0.05; camera.updateProjectionMatrix(); sky.position.copy(camera.position); }
  dayCol(DAY.sun, td, sun.color); dayCol(DAY.sky, td, hemi.color); dayCol(DAY.gnd, td, hemi.groundColor);
  dayCol(DAY.top, td, skyMat.uniforms.top.value); dayCol(DAY.hor, td, skyMat.uniforms.hor.value); scene.fog.color.copy(skyMat.uniforms.hor.value);
  scene.fog.near = Math.max(40, camD * 3); scene.fog.far = Math.max(520, camD * 9);
  const az = 0.7 + td * 1.3, el = lerp(1.05, 0.42, td * td), ce = Math.cos(el);
  sun.target.position.set(ctX, 0, ctZ);
  sun.position.set(ctX + Math.sin(az) * ce * camD * 4, Math.sin(el) * camD * 4, ctZ + Math.cos(az) * ce * camD * 4);
  const sc = sun.shadow.camera, hs = camD * 1.5; sc.left = -hs; sc.right = hs; sc.top = hs; sc.bottom = -hs; sc.near = camD * 0.5; sc.far = camD * 9; sc.updateProjectionMatrix();
  sun.shadow.normalBias = camD * 0.004; sun.shadow.bias = -0.0003;
  world.userData.tufts.visible = camD < 70;
  postMat.uniforms.blur.value = blurPx * DPR;
  flash *= Math.exp(-6 * dt); postMat.uniforms.flash.value = flash;
}

let last = performance.now(), blurPx = 5, fpsAcc = 0, fpsN = 0, quality = 0, warm = 0;
function frame(now){
  requestAnimationFrame(frame);
  let raw = (now - last) / 1000; last = now; if (!(raw > 0)) raw = 0.016; if (raw > 0.1) raw = 0.1;
  if (state !== 'pause'){
    let dt = Math.min(raw, 0.05); if (hitstop > 0){ hitstop -= raw; dt *= 0.05; }
    update(dt, raw);
    // если устройство не тянет — понемногу упрощаем картинку
    warm += raw; if (warm > 3){ fpsAcc += raw; fpsN++; if (fpsN >= 90){ const avg = fpsAcc / fpsN; fpsAcc = fpsN = 0;
      if (avg > 1 / 40 && quality < 3){ quality++; if (quality === 1){ DPR = Math.max(1, DPR * 0.75); resize(); } else if (quality === 2){ sun.castShadow = false; } else { blurPx = 0; DPR = 1; resize(); } } } }
  }
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}

resize(); resetGame(); state = 'title';
window.__jem = { get R(){ return R; }, set R(v){ R = v; }, items, TYPES, get world(){ return WS; }, get alive(){ return alive; }, biomeAt, roadAt, get state(){ return state; }, startGame, endGame, pickup };
if (QS.get('play')){ const at = (QS.get('at') || bx + ',' + bz).split(',').map(Number); bx = at[0]; bz = at[1]; dogX = bx; dogZ = bz + 1; ctX = bx; ctZ = bz; R = Rs = +QS.get('play'); camD = 5.6 * Math.pow(R / R0, 0.8); startGame(); }   // ?play=радиус&at=x,z — сразу в игру, для проверки
if (DBGC){ $('title').style.display = 'none';
  // сводка для отладки: сколько чего и хватает ли добычи, если подбирать только часть (доля eat)
  const oct = {}, byB = {}; for (const it of items){ const o = Math.floor(Math.log2(it.s)); oct[o] = (oct[o] || 0) + 1; const b = biomeAt(it.x, it.z) || 'sea'; byB[b] = (byB[b] || 0) + 1; }
  const sim = eat => { const L = items.map(it => it.s).sort((a, b) => a - b); let r = R0, k = 0, stall = null; for (const s of L){ if (s * PICK > r){ stall = [+r.toFixed(2), +s.toFixed(2)]; break; } if ((k++ * eat) % 1 < eat) r = Math.pow(Math.pow(r, GP) + GROW * Math.pow(s, GP), 1 / GP); } return { r: +r.toFixed(1), stall }; };
  console.log('STATS ' + JSON.stringify({ n: items.length, ba: +WS.ba.toFixed(2), sites: WS.sites.map(s => s.b + ':' + Math.round(s.x) + ',' + Math.round(s.z)).join(' '), oct, byB, all: sim(1), half: sim(.5), third: sim(.34), fifth: sim(.2) })); }
requestAnimationFrame(frame);
})();
